<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>sadfa 个人主页</title>
    <style>
        body { background: #e8e0d5; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        /* 导航栏 */
        .top-nav { width: 100%; padding: 15px; text-align: center; background: #d7ccc8; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; gap: 20px; }
        /* STR 蓝色链接 */
        .str-link { color: #1e88e5; font-weight: bold; font-size: 1.2rem; text-decoration: none; cursor: pointer; }
        .str-link:hover { text-decoration: underline; }
        /* 拟物化按钮 */
        .nav-btn { background: linear-gradient(to bottom, #fff, #e0e0e0); border: 1px solid #999; border-radius: 5px; padding: 8px 20px; cursor: pointer; box-shadow: 0 2px 0 #999; font-weight: bold; color: #333; transition: all 0.1s; }
        .nav-btn:active { transform: translateY(2px); box-shadow: none; background: #d0d0d0; }
        /* 内容区 */
        .container { background: #fdfbf7; padding: 30px; margin-top: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; display: none; }
        .active { display: block !important; }
        .profile-img { width: 100%; max-width: 500px; height: auto; border: 5px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin-top: 15px; }
        /* 井字棋 */
        #ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); width: 300px; height: 300px; margin: 20px auto; border: 5px solid #5d4037; }
        .cell { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 3rem; cursor: pointer; background: #f0d9b5; border: 2px solid #5d4037; box-sizing: border-box; }
        .cell:hover { background: #e6c9a8; }
        #status { font-weight: bold; color: #d84315; margin-bottom: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="top-nav">
        <button class="nav-btn" onclick="show('intro')">简介</button>
        <button class="nav-btn" onclick="show('play')">PLAY</button>
    </div>

    <!-- 简介页 -->
    <div id="intro" class="container active">
        <h2>关于我</h2>
        <!-- STR 蓝色链接 -->
        <p><a href="http://str.p8.ink" target="_blank" class="str-link">STR</a>服务器服主 | 车迷 </p>
        <!-- 图片占位 -->
        <img src="https://via.placeholder.com/1024x768?text=Sadfa+Photo" alt="photo" class="profile-img">
    </div>

    <!-- 游戏页 -->
    <div id="play" class="container">
        <h2>井字棋 (Tic-Tac-Toe)</h2>
        <div id="status">轮到你了 (X)</div>
        <div id="ttt-board"></div>
        <button class="nav-btn" onclick="initGame()">重新开始</button>
    </div>

<script>
    // 页面切换
    function show(id) {
        document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'play' && !board.length) initGame();
    }

    // 游戏逻辑
    let board = [], turn = 'X', over = false;
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function initGame() {
        board = Array(9).fill('');
        turn = 'X'; over = false;
        document.getElementById('status').innerText = "轮到你了 (X)";
        render();
    }

    function render() {
        const el = document.getElementById('ttt-board');
        el.innerHTML = '';
        for(let i=0; i<9; i++) {
            let cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = board[i];
            cell.onclick = () => playerMove(i);
            el.appendChild(cell);
        }
    }

    function playerMove(i) {
        if(over || board[i] || turn !== 'X') return;
        board[i] = 'X';
        if(checkWin('X')) { endGame("你赢了！"); return; }
        if(!board.includes('')) { endGame("平局！"); return; }
        turn = 'O'; 
        document.getElementById('status').innerText = "AI 思考中...";
        setTimeout(aiMove, 400);
        render();
    }

    function aiMove() {
        if(over) return;
        let move = findWinningMove('O') || findWinningMove('X');
        if(move === -1) {
            let empty = board.map((v,i)=> v===''?i:null).filter(v=>v!==null);
            move = empty[Math.floor(Math.random()*empty.length)];
        }
        board[move] = 'O';
        if(checkWin('O')) { endGame("AI 赢了！"); return; }
        if(!board.includes('')) { endGame("平局！"); return; }
        turn = 'X';
        document.getElementById('status').innerText = "轮到你了 (X)";
        render();
    }

    function findWinningMove(player) {
        for(let i=0; i<9; i++) {
            if(board[i] === '') {
                board[i] = player;
                if(checkWin(player)) { board[i] = ''; return i; }
                board[i] = '';
            }
        }
        return -1;
    }

    function checkWin(p) {
        return WINS.some(c => c.every(i => board[i] === p));
    }

    function endGame(msg) { over = true; document.getElementById('status').innerText = msg; }
</script>
</body>
</html>
